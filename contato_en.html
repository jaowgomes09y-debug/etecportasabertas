</head>

    <header class="topo">
        <div class="container nav">
            <a class="logo" href="index_en.html"><span>&lt;/&gt;</span> IT </a>
            <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
            <nav id="menu">
                <a href="index_en.html">Home</a>
                <a href="sobre_en.html">About</a>
                <a href="aplicacoes_en.html">Applications</a>
                <a href="bibliografia_en.html">Bibliography</a>
                <div class="submenu-container">
                    <a href="">Credits</a>
                    <div class="submenu">
                        <a href="orientadores_en.html">Advisors</a>
                        <a href="desenvolvedores_en.html">Developers</a>
                    </div>
                </div>

            </nav>
            <div class="seletor-idioma" aria-label="Select language">
                <a href="contato.html" class="idioma" lang="pt-BR">PT</a>
                <a href="contato_en.html" class="idioma ativo" lang="en" aria-current="page">USA</a>
            </div>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main>
        <section class="page-header container">
            <h1>Contact the team</h1>
            <p>Send a message, rate the website or leave a suggestion.</p>
        </section>

        <section class="container contato-grid" style="display: block; max-width: 600px; margin: 0 auto;">
            <form id="contactForm" novalidate>
                <div class="campo">
                    <label for="nome">Full name</label>
                    <input id="nome" name="nome" type="text" minlength="3" required pattern="[A-Za-zÀ-ÿ\s]+">
                    <small class="erro"></small>
                </div>
        
                <div class="campo">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required placeholder="example@email.com">
                    <small class="erro"></small>
                </div>
        
                <div class="campo">
                    <label for="telefone">Phone</label>
                    <input id="telefone" name="telefone" type="tel" pattern="[0-9() +.-]{8,}" required placeholder="(19) 99999-9999">
                    <small class="erro"></small>
                </div>
        
                <div class="campo">
                    <label for="nota">Rate our website</label>
                    <select id="nota" name="nota" required>
                        <option value="">Select</option>
                        <option>1 - Bad</option>
                        <option>2 - Fair</option>
                        <option>3 - Good</option>
                        <option>4 - Very good</option>
                        <option>5 - Excellent</option>
                    </select>
                    <small class="erro"></small>
                </div>
        
                <div class="campo">
                    <label for="comentario">Comment</label>
                    <textarea id="comentario" name="comentario"></textarea>
                </div>
        
                <button class="btn principal" type="submit">Send</button>
                <p id="formMsg" class="form-msg"></p>
            </form>
        </section>
    <!-- ==================== FOOTER ==================== -->
    <footer>
        <a href="#top" class="btn-topo" aria-label="Back to top">

        </a>
        <div class="container footer-grid">
            <div>
                <p>ETEC de Hortolândia • 2026</p>
                <p>© <span> All rights reserved. Non-profit academic work.</span></p>
            </div>
        </div>
    </footer>

    <script src="script_en.js"></script>
</body>
</html>
