            <a class="logo" href="index.html"><span>&lt;/&gt;</span> TI </a>
            <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>

            </div>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main>
        <section class="page-header container">
            <h1>Fale com a equipe</h1>
            <p>Envie uma mensagem, avalie o site ou deixe uma sugestão.</p>
        </section>

        <section class="container contato-grid" style="display: block; max-width: 600px; margin: 0 auto;">
            <form id="contactForm" novalidate>
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input id="nome" name="nome" type="text" minlength="3" maxlength="100" required pattern="[A-Za-zÀ-ÿ ]+" autocomplete="name">
                    <small class="erro"></small>
                </div>
        
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required placeholder="exemplo@email.com" autocomplete="email">
                    <small class="erro"></small>
                </div>
        
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" type="tel" inputmode="numeric" minlength="10" maxlength="11" pattern="[0-9]{10,11}" required placeholder="(19) 99999-9999" autocomplete="tel">
                    <small class="erro"></small>
                </div>
        
                <div class="campo">
                    <label for="nota">Avalie nosso site</label>
                    <select id="nota" name="nota" required>
                        <option value="">Selecione</option>
                        <option>1 - Ruim</option>
                        <option>2 - Regular</option>
                        <option>3 - Bom</option>
                        <option>4 - Muito bom</option>
                        <option>5 - Excelente</option>
                    </select>
                    <small class="erro"></small>
                </div>
        
                <div class="campo">
                    <label for="comentario">Comentário</label>
                    <textarea id="comentario" name="comentario"></textarea>
                </div>
        
                <button class="btn principal" type="submit">Enviar</button>
                <p id="formMsg" class="form-msg"></p>
            </form>
        </section>
    <!-- ==================== FOOTER ==================== -->
    <footer>

    <script src="script.js"></script>
</body>
</html>
